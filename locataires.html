<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Locataires - ImmoGérer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-building-shield"></i>
                <h2>ImmoGérer</h2>
            </div>
            <ul>
                <li><a href="/"><i class="fa-solid fa-chart-pie"></i> Tableau de bord</a></li>
                <li><a href="/locataires" class="active"><i class="fa-solid fa-users"></i> Locataires</a></li>
                <li><a href="/biens"><i class="fa-solid fa-city"></i> Biens immobiliers</a></li>
                <li><a href="/baux"><i class="fa-solid fa-file-contract"></i> Contrats de Baux</a></li>
                <li><a href="/paiements"><i class="fa-solid fa-wallet"></i> Finances & Paiements</a></li>
                <li><a href="/comptabilite"><i class="fa-solid fa-calculator"></i> Comptabilité Générale</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h1>Gestion des Locataires</h1>
                <button onclick="toggleFormulaire()" class="btn-primary" style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer;">
                    <i class="fa-solid fa-user-plus"></i> Ajouter un locataire
                </button>
            </header>

            <!-- Formulaire d'ajout (caché par défaut, s'affiche au clic) -->
            <div id="form-container" class="form-container" style="display: none; margin-bottom: 25px;">
                <h3>Nouveau Locataire</h3>
                <form action="/api/locataires" method="POST">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="form-group">
                            <label>Nom :</label>
                            <input type="text" name="nom" required placeholder="Nom de famille">
                        </div>
                        <div class="form-group">
                            <label>Prénom :</label>
                            <input type="text" name="prenom" required placeholder="Prénom">
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="form-group">
                            <label>Email :</label>
                            <input type="email" name="email" placeholder="adresse@email.com">
                        </div>
                        <div class="form-group">
                            <label>Téléphone :</label>
                            <input type="text" name="telephone" placeholder="+243...">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Date de naissance :</label>
                        <input type="date" name="date_naissance">
                    </div>
                    <button type="submit" class="btn-primary">Enregistrer le locataire</button>
                </form>
            </div>

            <!-- Tableau des locataires -->
            <section class="card" style="max-width: 100%; overflow-x: auto;">
                <h3>Liste des Locataires Enregistrés</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Prénom</th>
                            <th>Email</th>
                            <th>Téléphone</th>
                            <th>Date de naissance</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="locataires-list">
                        <tr><td colspan="6" style="text-align:center;">Chargement...</td></tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        function toggleFormulaire() {
            const form = document.getElementById('form-container');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        function chargerLocataires() {
            fetch('/api/locataires')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('locataires-list');
                    if (data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Aucun locataire enregistré.</td></tr>';
                        return;
                    }
                    tbody.innerHTML = data.map(l => `
                        <tr>
                            <td>${l.nom || ''}</td>
                            <td>${l.prenom || ''}</td>
                            <td>${l.email || ''}</td>
                            <td>${l.telephone || ''}</td>
                            <td>${l.date_naissance ? l.date_naissance.substring(0, 10) : ''}</td>
                            <td>
                                <button class="btn-action btn-delete" onclick="supprimerLocataire(${l.id})">Supprimer</button>
                            </td>
                        </tr>
                    `).join('');
                });
        }

        function supprimerLocataire(id) {
            if (confirm("Voulez-vous vraiment supprimer ce locataire ?")) {
                fetch(`/api/locataires/${id}`, { method: 'DELETE' })
                    .then(res => { if (res.ok) chargerLocataires(); });
            }
        }

        chargerLocataires();
    </script>
</body>
</html>
