<script>
        function toggleFormulaire() {
            const form = document.getElementById('form-container');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        function chargerBiens() {
            fetch('/api/biens')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('biens-list');
                    if (!tbody) return; // Sécurité si l'élément n'est pas encore prêt
                    
                    if (data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: #64748b;">Aucun bien immobilier enregistré.</td></tr>';
                        return;
                    }
                    tbody.innerHTML = data.map(b => `
                        <tr>
                            <td><strong>${b.nom_bien || ''}</strong></td>
                            <td>${b.type || ''}</td>
                            <td>${parseFloat(b.loyer || 0).toLocaleString()} $</td>
                            <td><span class="badge ${b.statut === 'Loué' ? 'badge-success' : 'badge-warning'}">${b.statut || 'Libre'}</span></td>
                            <td>
                                <button class="btn-action btn-delete" onclick="supprimerBien(${b.id})">Supprimer</button>
                            </td>
                        </tr>
                    `).join('');
                })
                .catch(err => {
                    console.error("Erreur de chargement des biens:", err);
                });
        }

        function supprimerBien(id) {
            if (confirm("Voulez-vous vraiment supprimer ce bien immobilier ?")) {
                fetch(`/api/biens/${id}`, { method: 'DELETE' })
                    .then(res => { 
                        if (res.ok) {
                            chargerBiens();
                        } else {
                            alert("Erreur lors de la suppression.");
                        }
                    });
            }
        }

        // S'assure que le DOM est totalement chargé avant de lancer la fonction
        document.addEventListener('DOMContentLoaded', () => {
            chargerBiens();
        });
    </script>
