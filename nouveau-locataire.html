<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau Locataire - ImmoGérer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Barre latérale -->
        <aside class="sidebar">
            <h2>ImmoGérer</h2>
            <ul>
                <li><a href="/"><i class="fa-solid fa-house"></i> Tableau de bord</a></li>
                <li><a href="/locataires"><i class="fa-solid fa-users"></i> Locataires</a></li>
                <li><a href="/nouveau-locataire" class="active"><i class="fa-solid fa-user-plus"></i> Nouveau Locataire</a></li>
                <li><a href="/comptabilite"><i class="fa-solid fa-calculator"></i>
            </ul>
        </aside>

        <!-- Contenu principal -->
        <main class="main-content">
            <header>
                <h1>Ajouter un nouveau locataire</h1>
            </header>

            <section class="card" style="margin-top: 20px; max-width: 600px;">
                <form action="/api/locataires" method="POST">
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Nom :</label>
                        <input type="text" name="nom" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Prénom :</label>
                        <input type="text" name="prenom" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Email :</label>
                        <input type="email" name="email" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Téléphone :</label>
                        <input type="text" name="telephone" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    </div>

                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Date de naissance :</label>
                        <input type="date" name="date_naissance" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    </div>

                    <button type="submit" class="btn-primary" style="padding: 10px 20px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer;">Enregistrer le locataire</button>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
